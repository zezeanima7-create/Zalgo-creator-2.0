
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <title>Créditos | Zalgo Lab</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #09090f;
      color: #f3f3fa;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      background: #14141f;
      border: 1px solid #303044;
      border-radius: 20px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 12px;
    }

    h1 { margin: 8px 0; }

    p {
      color: #b8b8cc;
      line-height: 1.7;
    }

    a {
      color: #a99cff;
      text-decoration: none;
    }

    .profile {
      display: inline-block;
      margin: 16px 0;
      padding: 13px 18px;
      background: #242439;
      border: 1px solid #48486a;
      border-radius: 12px;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      background: #a99cff;
      color: #11111a;
      border-radius: 10px;
      font-weight: bold;
    }

    footer {
      margin-top: 26px;
      color: #77778d;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">✦</div>
    <h1>Créditos</h1>
    <p>Conheça quem criou o Zalgo Lab.</p>

    <h2>Zeze Anima</h2>
    <p>Criação e desenvolvimento do projeto.</p>

    <a class="profile"
       href="https://github.com/zezeanima7-create"
       target="_blank"
       rel="noopener noreferrer">
      ◉ Ver perfil no GitHub
    </a>

    <p>
      Obrigado por visitar o Zalgo Lab!
    </p>

    <a class="back" href="./index.html">
      ← Voltar ao gerador
    </a>

    <footer>
      Zalgo Lab · Créditos
    </footer>
  </main>
</body>
</html>
