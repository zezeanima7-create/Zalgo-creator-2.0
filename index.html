
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202124">
  <meta name="description" content="Zalgo Creator 2.0 — crie textos distorcidos e personalizados.">
  <title>Zalgo Creator 2.0</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #18191b;
      --panel: #222427;
      --panel2: #292b2f;
      --border: #383a3f;
      --text: #f1f1f1;
      --muted: #a5a7ad;
      --accent: #d7d9de;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
    }

    .nav, main, footer {
      max-width: 850px;
      margin: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .version {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    main { padding: 48px 18px 30px; }
    .intro { margin-bottom: 28px; }

    h1 {
      font-size: clamp(28px, 6vw, 42px);
      letter-spacing: -1.5px;
      margin: 0 0 10px;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 650;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 125px;
      resize: vertical;
      background: #191a1c;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 14px;
      font: inherit;
      outline: none;
    }

    textarea:focus, button:focus-visible {
      outline: 2px solid #a9abb1;
      outline-offset: 2px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      background: var(--accent);
      color: #202124;
      border: 1px solid var(--accent);
      border-radius: 9px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: var(--panel2);
      border-color: var(--border);
      color: var(--text);
    }

    button:hover { filter: brightness(1.08); }

    .status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }

    footer {
      padding: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      main { padding-top: 32px; }
      .card { padding: 15px; }
      .controls button { flex: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div>
        <div class="brand">Zalgo Creator</div>
        <div class="version">Versão 2.0</div>
      </div>
      <span class="version">TEXT TOOL</span>
    </div>
  </header>

  <main>
    <section class="intro">
      <h1>Crie seu texto.</h1>
      <p>Transforme palavras comuns em textos Zalgo personalizados.</p>
    </section>

    <section class="card">
      <label for="source">Texto original</label>
      <textarea id="source" placeholder="Digite seu texto aqui..."></textarea>

      <div class="controls">
        <button id="generate">Gerar Zalgo</button>
        <button class="secondary" id="copy">Copiar resultado</button>
        <button class="secondary" id="clear">Limpar</button>
      </div>
    </section>

    <section class="card">
      <label for="result">Resultado</label>
      <textarea id="result" placeholder="Seu resultado aparecerá aqui..."></textarea>
      <p class="status" id="message" aria-live="polite">Pronto para começar.</p>
    </section>
  </main>

  <footer>
    Zalgo Creator 2.0 · Ferramenta gratuita de texto
  </footer>

  <script>
    const source = document.getElementById("source");
    const result = document.getElementById("result");
    const message = document.getElementById("message");

    const marks = {
      up: ["\u030d","\u030e","\u0304","\u0305","\u033f","\u0311","\u0306"],
      mid: ["\u0334","\u0335","\u0336","\u0337","\u0338"],
      down: ["\u0316","\u0317","\u0318","\u0319","\u031c","\u0323","\u0324","\u0325"]
    };

    function randomMark(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    document.getElementById("generate").onclick = () => {
      const text = source.value;

      if (!text) {
        message.textContent = "Digite alguma coisa primeiro.";
        return;
      }

      result.value = Array.from(text).map(char => {
        if (char.trim() === "") return char;

        let output = char;
        const count = 1 + Math.floor(Math.random() * 3);

        for (let i = 0; i < count; i++)
          output += randomMark(marks.up);

        for (let i = 0; i < count; i++)
          output += randomMark(marks.mid);

        for (let i = 0; i < count; i++)
          output += randomMark(marks.down);

        return output;
      }).join("");

      message.textContent = "Texto Zalgo gerado.";
    };

    document.getElementById("copy").onclick = async () => {
      if (!result.value) {
        message.textContent = "Gere um texto antes de copiar.";
        return;
      }

      try {
        await navigator.clipboard.writeText(result.value);
        message.textContent = "Texto copiado!";
      } catch {
        result.focus();
        result.select();
        message.textContent =
          "Selecione o resultado e copie manualmente.";
      }
    };

    document.getElementById("clear").onclick = () => {
      source.value = "";
      result.value = "";
      message.textContent = "Campos limpos.";
    };
  </script>
</body>
</html>
