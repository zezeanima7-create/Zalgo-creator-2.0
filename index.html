
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b1c">
  <meta name="description" content="Zalgo Lab: transforme textos comuns em textos Zalgo com efeitos glitch.">
  <title>Zalgo Lab — Gerador de Texto</title>

  <style>
    :root {
      --bg: #100b1c;
      --panel: #1c142b;
      --panel2: #271b3a;
      --purple: #9b5cff;
      --pink: #e879f9;
      --text: #f8f5ff;
      --muted: #b9adc9;
      --border: #423052;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, Arial, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 20px 0 24px;
    }

    .logo {
      font-size: clamp(34px, 8vw, 52px);
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #c084fc, #f0abfc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0;
    }

    header p {
      color: var(--muted);
      margin-top: 8px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 14px;
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      background: #120d1d;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    textarea:focus,
    select:focus {
      border-color: var(--purple);
    }

    .counter {
      text-align: right;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #120d1d;
      color: var(--text);
      font: inherit;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--purple);
    }

    .intensity-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    .intensity-label span {
      color: var(--pink);
      font-weight: bold;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 15px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      flex: 1 1 130px;
      transition: transform .15s, opacity .15s;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .primary {
      background: linear-gradient(100deg, #7c3aed, #a855f7);
    }

    .share {
      background: linear-gradient(100deg, #9333ea, #db2777);
    }

    .output {
      min-height: 100px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.8;
      padding: 14px;
      border-radius: 12px;
      background: #120d1d;
      border: 1px solid var(--border);
    }

    .empty {
      color: #81738f;
    }

    .status {
      color: var(--pink);
      font-size: 13px;
      min-height: 20px;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 20px 8px;
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: #c084fc;
      text-decoration: none;
      margin: 0 5px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1 class="logo">Zalgo Lab</h1>
      <p>Transforme seus textos em puro glitch. ✨</p>
    </header>

    <main>
      <section class="panel">
        <h2>✍️ Seu texto</h2>

        <label for="entrada">Digite ou cole seu texto aqui:</label>
        <textarea
          id="entrada"
          maxlength="2000"
          placeholder="Digite algo para transformar..."
        ></textarea>

        <div class="counter">
          <span id="contador">0</span>/2000 caracteres
        </div>

        <div class="intensity-label">
          <label for="intensidade">Intensidade do efeito</label>
          <span id="valorIntensidade">5</span>
        </div>

        <input
          id="intensidade"
          type="range"
          min="1"
          max="10"
          value="5"
        >

        <div style="margin-top:18px">
          <label for="modo">Tipo de efeito</label>
          <select id="modo">
            <option value="todos">Completo — acima e abaixo</option>
            <option value="cima">Sinais acima</option>
            <option value="baixo">Sinais abaixo</option>
            <option value="meio">Glitch no meio</option>
          </select>
        </div>

        <div class="buttons">
          <button class="primary" id="gerar">⚡ Gerar Zalgo</button>
          <button id="limpar">🗑️ Limpar</button>
        </div>
      </section>

      <section class="panel">
        <h2>👾 Resultado</h2>

        <div id="resultado" class="output empty" aria-live="polite">
          Seu texto transformado aparecerá aqui...
        </div>

        <div class="buttons">
          <button class="primary" id="copiar">📋 Copiar texto</button>
          <button id="parar">⏹️ Interromper efeito</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>📤 Compartilhe o Zalgo Lab</h2>
        <p class="small">
          Gostou do gerador? Compartilhe com seus amigos!
        </p>

        <button class="share" id="compartilhar" style="width:100%">
          📤 Compartilhe
        </button>
      </section>
    </main>

    <footer>
      <p>© 2026 Zalgo Lab</p>
      <a href="./creditos.html">Créditos</a>
      |
      <a href="./privacidade.html">Política de Privacidade</a>
    </footer>
  </div>

  <script>
    const entrada = document.getElementById("entrada");
    const resultado = document.getElementById("resultado");
    const intensidade = document.getElementById("intensidade");
    const valorIntensidade = document.getElementById("valorIntensidade");
    const modo = document.getElementById("modo");
    const contador = document.getElementById("contador");
    const status = document.getElementById("status");

    let interrompido = false;

    const cima = [
      "\u030d", "\u030e", "\u0304", "\u0305", "\u033f",
      "\u0311", "\u0306", "\u0310", "\u0352", "\u0357",
      "\u0351", "\u0307", "\u0308", "\u030a", "\u0342",
      "\u0343", "\u0344", "\u034a", "\u034b", "\u034c",
      "\u0303", "\u0302", "\u030c", "\u0350", "\u0300",
      "\u0301", "\u030b", "\u030f", "\u0312", "\u0313"
    ];

    const baixo = [
      "\u0316", "\u0317", "\u0318", "\u0319", "\u031c",
      "\u031d", "\u031e", "\u031f", "\u0320", "\u0324",
      "\u0325", "\u0326", "\u0329", "\u032a", "\u032b",
      "\u032c", "\u032d", "\u032e", "\u032f", "\u0330",
      "\u0331", "\u0332", "\u0333", "\u0339", "\u033a",
      "\u033b", "\u033c", "\u0345"
    ];

    const meio = [
      "\u0315", "\u031b", "\u0340", "\u0341", "\u0358",
      "\u1ab0", "\u1ab1", "\u1ab2", "\u20d0", "\u20d1",
      "\u20d2", "\u20d3", "\u20d4", "\u20d5", "\u20d6",
      "\u20d7", "\u20db", "\u20dc"
    ];

    function aleatorio(lista) {
      return lista[Math.floor(Math.random() * lista.length)];
    }

    function gerarZalgo(texto, nivel, tipo) {
      let saida = "";

      for (const caractere of texto) {
        if (interrompido) {
          saida += caractere;
          continue;
        }

        saida += caractere;

        // Não adiciona sinais em espaços ou quebras de linha.
        if (/\s/.test(caractere)) continue;

        const quantidade = Math.ceil(nivel / 2);

        for (let i = 0; i < quantidade; i++) {
          if (tipo === "todos" || tipo === "cima") {
            saida += aleatorio(cima);
          }

          if (tipo === "todos" || tipo === "baixo") {
            saida += aleatorio(baixo);
          }

          if (tipo === "meio") {
            saida += aleatorio(meio);
          }
        }

        // Intensidades maiores adicionam mais sinais.
        if (nivel >= 7) {
          for (let i = 0; i < Math.floor(nivel / 3); i++) {
            if (tipo === "todos" || tipo === "cima") {
              saida += aleatorio(cima);
            }

            if (tipo === "todos" || tipo === "baixo") {
              saida += aleatorio(baixo);
            }

            if (tipo === "meio") {
              saida += aleatorio(meio);
            }
          }
        }
      }

      return saida;
    }

    function atualizarContador() {
      contador.textContent = entrada.value.length;
    }

    entrada.addEventListener("input", atualizarContador);

    intensidade.addEventListener("input", () => {
      valorIntensidade.textContent = intensidade.value;
    });

    document.getElementById("gerar").addEventListener("click", () => {
      const texto = entrada.value;

      if (!texto.trim()) {
        status.textContent = "Digite um texto primeiro!";
        entrada.focus();
        return;
      }

      interrompido = false;
      status.textContent = "";

      const textoGerado = gerarZalgo(
        texto,
        Number(intensidade.value),
        modo.value
      );

      resultado.textContent = textoGerado;
      resultado.classList.remove("empty");
      status.textContent = "Texto Zalgo gerado com sucesso!";
    });

    document.getElementById("parar").addEventListener("click", () => {
      interrompido = true;
      status.textContent = "Interrupção ativada para a próxima geração.";
    });

    document.getElementById("limpar").addEventListener("click", () => {
      entrada.value = "";
      resultado.textContent = "Seu texto transformado aparecerá aqui...";
      resultado.classList.add("empty");
      status.textContent = "";
      interrompido = false;
      atualizarContador();
    });

    document.getElementById("copiar").addEventListener("click", async () => {
      const texto = resultado.classList.contains("empty")
        ? ""
        : resultado.textContent;

      if (!texto) {
        status.textContent = "Gere um texto antes de copiar.";
        return;
      }

      try {
        await navigator.clipboard.writeText(texto);
        status.textContent = "Texto copiado!";
      } catch {
        const campo = document.createElement("textarea");
        campo.value = texto;
        document.body.appendChild(campo);
        campo.select();

        try {
          document.execCommand("copy");
          status.textContent = "Texto copiado!";
        } catch {
          status.textContent = "Não foi possível copiar automaticamente.";
        }

        campo.remove();
      }
    });

    document.getElementById("compartilhar").addEventListener("click", async () => {
      const dados = {
        title: "Zalgo Lab",
        text: "Teste esse app Zalgo Lab! 😈🔥 Crie textos glitch e deixe suas mensagens bizarras!",
        url: "https://zezeanima7-create.github.io/Zalgo-creator-2.0/"
      };

      try {
        if (navigator.share) {
          await navigator.share(dados);
        } else {
          const mensagem = dados.text + "\n\n" + dados.url;

          try {
            await navigator.clipboard.writeText(mensagem);
            alert("Mensagem e link copiados! Agora é só compartilhar.");
          } catch {
            prompt("Copie a mensagem para compartilhar:", mensagem);
          }
        }
      } catch (erro) {
        if (erro.name !== "AbortError") {
          alert("Não foi possível abrir o compartilhamento.");
        }
      }
    });
  </script>
</body>
  </html>
